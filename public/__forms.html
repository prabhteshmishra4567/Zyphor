<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Netlify form detection</title>
  </head>
  <body>
    <form name="product-enquiry" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="product-enquiry">
      <input name="name" type="text">
      <input name="company-name" type="text">
      <input name="mobile-number" type="tel">
      <input name="city-state" type="text">
      <input name="business-type" type="text">
      <input name="product-interest" type="text">
      <input name="required-quantity" type="text">
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
